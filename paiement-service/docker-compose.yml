version: '3.8'

services:
  # --- 1. Base de données PostgreSQL ---
  payment-db:
    image: postgres:15-alpine
    container_name: payment-db
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=payment_db
    ports:
      - "5432:5432"
    volumes:
      - payment_db_data:/var/lib/postgresql/data
    restart: always

  # --- 2. RabbitMQ (Le "facteur" pour les événements) ---
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Port pour que ton code Java discute
      - "15672:15672" # Port pour que TU vois l'interface web
    environment:
      - RABBITMQ_DEFAULT_USER=user
      - RABBITMQ_DEFAULT_PASS=password
    restart: always

  # --- 3. Ton Microservice (Optionnel en phase de dev) ---
  # Je l'ai configuré, mais pour l'instant tu vas surtout lancer ton code depuis IntelliJ
  payment-service:
    build: ./paiement-service  # ⚠️ Vérifie que c'est bien le nom exact de ton dossier
    container_name: payment-service
    ports:
      - "8081:8080" # On mappe le port 8081 de ton Mac vers le 8080 du conteneur
    environment:
      # On dit à Spring de ne pas chercher "localhost" mais le nom du conteneur "payment-db"
      - SPRING_DATASOURCE_URL=jdbc:postgresql://payment-db:5432/payment_db
      - SPRING_DATASOURCE_USERNAME=admin
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      # Config RabbitMQ
      - SPRING_RABBITMQ_HOST=rabbitmq
      - SPRING_RABBITMQ_PORT=5672
      - SPRING_RABBITMQ_USERNAME=user
      - SPRING_RABBITMQ_PASSWORD=password
    depends_on:
      - payment-db
      - rabbitmq

volumes:
  payment_db_data: # Pour ne pas perdre tes données si tu éteins Docker
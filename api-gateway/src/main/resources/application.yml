server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://localhost:8081
              predicates:
                - Path=/api/users/**

            - id: event-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/events/**
                -
            - id: billetterie-service
              uri: http://localhost:8082
              predicates:
                - Path=/api/billetterie/**,/api/tickets/**
            - id: payment-service
              uri: http://localhost:8084
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: http://localhost:8085
              predicates:
                - Path=/api/notification/**

server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: http://user-service:8081
              predicates:
                - Path=/api/users/**

            - id: event-service
              uri: http://event-service:8084
              predicates:
                - Path=/api/events/**

            - id: billetterie-service
              uri: http://billetterie-service:8082
              predicates:
                - Path=/api/tickets/**

            - id: payment-service
              uri: http://paiement-service:8083
              predicates:
                - Path=/api/payments/**

            - id: notification-service
              uri: http://notification-service:8085
              predicates:
                - Path=/api/notifications/**

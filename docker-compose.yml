version: '3.8'

services:
  # --- 1. Service BILLETERIE ---
  postgres_billeterie:
    image: postgres:15
    container_name: postgres_billetterie
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: billetteriedb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  billetterie-service:
    build:
      context: ./billetterie-service
    container_name: billetterie_service
    ports:
      - "8082:8080"
    depends_on:
      - postgres_billeterie
      - rabbitmq
      - event-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_billeterie:5432/billetteriedb
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq
      EVENT_SERVICE_URL: http://event-service:8083

  # --- 2. Service EVENT ---
  postgres_event:
    image: postgres:15
    container_name: postgres_event
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: event_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_event_data:/var/lib/postgresql/data

  event-service:
    build:
      context: ./event-service
    container_name: event_service
    ports:
      - "8083:8083"
    depends_on:
      - postgres_event
      - rabbitmq
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_event:5432/event_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_RABBITMQ_HOST: rabbitmq

  # --- 3. Service PAIEMENT (Nouveau !) ---
  postgres_payment:
    image: postgres:15
    container_name: postgres_payment
    environment:
      POSTGRES_USER: postgres 
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: payment_db
    ports:
      - "5434:5432" # Port externe 5434 pour éviter les conflits
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data

  paiement-service:
    build:
      context: ./paiement-service
    container_name: paiement_service
    ports:
      - "8081:8083"
    depends_on:
      - postgres_payment
      - rabbitmq
    environment:
      # Configuration spécifique Docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_payment:5432/payment_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

  # --- 4. Service NOTIFICATION ---
  notification-service:
    build:
      context: ./notification-service
    container_name: notification_service
    ports:
      - "8085:8084"
    depends_on:
      - rabbitmq
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672

  # --- 5. Service USERS ---
  postgres_users:
    image: postgres:16
    container_name: postgres_users
    environment:
      POSTGRES_DB: usersdb
      POSTGRES_USER: users_user
      POSTGRES_PASSWORD: users_password
    ports:
      - "5434:5432"
    volumes:
      - postgres_users_data:/var/lib/postgresql/data

  user-service:
    build:
      context: ./user-service
    container_name: user_service
    ports:
      - "8081:8081"
    depends_on:
      - postgres_users
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres_users:5432/usersdb
      SPRING_DATASOURCE_USERNAME: users_user
      SPRING_DATASOURCE_PASSWORD: users_password

  # --- INFRASTRUCTURE PARTAGÉE ---
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5673:5672"   
      - "15673:15672" 

volumes:
  postgres_data:
  postgres_event_data:
  postgres_payment_data:
  postgres_users_data: